<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Soft Landing</title>
  <desc id="desc">A descending path lands on a saved checkpoint. Quota warnings, checkpoints and manual resume.</desc>
  <rect width="1200" height="340" rx="24" fill="#101c2b"/>
  <path d="M60 70H1140M60 135H1140M60 200H1140M60 265H1140" stroke="#203045" stroke-width="1"/>
  <path d="M820 68C863 70 851 166 902 184S978 224 1040 224" fill="none" stroke="#88dfc2" stroke-width="6" stroke-linecap="round"/>
  <path d="M808 57l30 12-28 15 5-15z" fill="#88dfc2"/>
  <circle cx="1040" cy="224" r="10" fill="#88dfc2"/>
  <path d="M986 250h108" stroke="#88dfc2" stroke-width="4" stroke-linecap="round"/>
  <text x="74" y="91" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="4" fill="#88dfc2">SAVE YOUR PLACE</text>
  <text x="70" y="180" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#f3f6f7">soft landing</text>
  <text x="74" y="231" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#b6c4d3">Quota warnings, checkpoints and manual resume.</text>
  <text x="74" y="295" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8396ac">FOR CODEX  /  LOCAL CHECKPOINTS  /  OPEN SOURCE</text>
</svg>
